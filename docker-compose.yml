version: '3.8'

services:
  backend:
    build: ./nexusai-news-backend
    ports:
      - '5000:5000'
    env_file:
      - ./nexusai-news-backend/.env
    environment:
      - CLIENT_URL=http://localhost:3000
    restart: unless-stopped

  frontend:
    build: ./nexusai-frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped
