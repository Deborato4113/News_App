<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusAI — Regional Current Affairs</title>
    <meta name="description" content="NexusAI delivers AI-summarized regional current affairs, quizzes, and a news Q&A assistant tailored to your city." />
    <meta name="theme-color" content="#0E0F11" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try { var t = localStorage.getItem("nexusai_theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>

    <!-- Open Graph / link previews. %SITE% is filled in at build time (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexusAI" />
    <meta property="og:title" content="NexusAI — Regional Current Affairs" />
    <meta property="og:description" content="AI-summarized regional news, quizzes, and a news Q&A assistant tailored to your city." />
    <meta property="og:image" content="%SITE%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NexusAI: regional news, summarised and checked by AI" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexusAI — Regional Current Affairs" />
    <meta name="twitter:description" content="AI-summarized regional news, quizzes, and a news Q&A assistant tailored to your city." />
    <meta name="twitter:image" content="%SITE%/og-image.png" />

    <meta name="robots" content="noindex, nofollow" />
    <!-- Logged-in dashboard app — not meant to be indexed. Remove/adjust
         this tag if you add public, unauthenticated pages later. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
